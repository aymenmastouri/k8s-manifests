# ─── AI Lab · Postgres daily backups ──────────────────────────────
# Runs every day at 02:15 UTC. Dumps authentik/langfuse/mlflow DBs
# with pg_dump -Fc (custom format), stores in /backups/<db>/<ts>.dump
# on the ai-lab-backups PVC. Keeps the last 7 days, prunes older.
# Restore: pg_restore -d <db> /backups/<db>/<ts>.dump
# ──────────────────────────────────────────────────────────────────

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ai-lab-backups
  namespace: apps
  labels:
    app.kubernetes.io/part-of: ai-lab
    app.kubernetes.io/component: backup-store
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: apps
  labels:
    app.kubernetes.io/part-of: ai-lab
    app.kubernetes.io/component: backup
spec:
  schedule: "15 2 * * *"            # daily 02:15 UTC
  timeZone: "Europe/Berlin"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: postgres-backup
            app.kubernetes.io/part-of: ai-lab
        spec:
          restartPolicy: OnFailure
          containers:
            - name: dump
              image: postgres:16-alpine
              imagePullPolicy: IfNotPresent
              resources:
                requests: { cpu: 50m,  memory: 64Mi  }
                limits:   { cpu: 500m, memory: 256Mi }
              env:
                # optional: true -> der Job startet auch, solange einzelne
                # Dienste (z.B. langfuse) noch nicht ausgerollt sind.
                - name: PGPASSWORD_AUTHENTIK
                  valueFrom:
                    secretKeyRef:
                      name: authentik-secrets
                      key: POSTGRES_PASSWORD
                      optional: true
                - name: PGPASSWORD_LANGFUSE
                  valueFrom:
                    secretKeyRef:
                      name: langfuse-secrets
                      key: LANGFUSE_DB_PASSWORD
                      optional: true
                - name: PGPASSWORD_MLFLOW
                  valueFrom:
                    secretKeyRef:
                      name: mlflow-secrets
                      key: MLFLOW_DB_PASSWORD
                      optional: true
              command:
                - /bin/sh
                - -c
                - |
                  # Bewusst KEIN set -e: jede Datenbank wird unabhaengig
                  # gesichert. Faellt eine aus, sollen die anderen trotzdem
                  # ein Backup bekommen. Der Job endet am Ende mit rc=1,
                  # damit der Fehlschlag trotzdem sichtbar bleibt.
                  set -u
                  TS=$(date -u +%Y%m%dT%H%M%SZ)
                  RETAIN_DAYS=7
                  rc=0

                  dump() {
                    name=$1; host=$2; user=$3; db=$4; pass=$5
                    mkdir -p "/backups/${name}"
                    if [ -z "${pass}" ]; then
                      echo "[${TS}] ${name}: kein Passwort gesetzt (Dienst noch nicht ausgerollt?) - uebersprungen"
                      return 0
                    fi
                    echo "[${TS}] -> ${name}"
                    if PGPASSWORD="${pass}" pg_dump -Fc -h "${host}" -U "${user}" \
                         -d "${db}" -f "/backups/${name}/${TS}.dump" 2>/tmp/${name}.err; then
                      echo "[${TS}]    ok, $(ls -lh /backups/${name}/${TS}.dump | awk '{print $5}')"
                    else
                      echo "[${TS}]    FEHLER bei ${name}:"
                      sed 's/^/[${TS}]      /' "/tmp/${name}.err" | tail -3
                      rm -f "/backups/${name}/${TS}.dump"   # kein halbes Dump-File zuruecklassen
                      rc=1
                    fi
                  }

                  dump authentik authentik-postgres authentik authentik "${PGPASSWORD_AUTHENTIK:-}"
                  dump langfuse  langfuse-postgres  langfuse  langfuse  "${PGPASSWORD_LANGFUSE:-}"
                  dump mlflow    mlflow-postgres    mlflow    mlflow    "${PGPASSWORD_MLFLOW:-}"

                  echo "[${TS}] entferne Dumps aelter als ${RETAIN_DAYS} Tage"
                  find /backups -name '*.dump' -mtime +${RETAIN_DAYS} -print -delete

                  echo "[${TS}] fertig. aktueller Stand:"
                  du -sh /backups/* 2>/dev/null || echo "  (noch leer)"
                  exit ${rc}
              volumeMounts:
                - { name: backups, mountPath: /backups }
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: ai-lab-backups

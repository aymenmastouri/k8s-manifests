# argocd-server laeuft hinter Traefik, das TLS bereits terminiert.
# Ohne server.insecure wuerde argocd-server selbst nochmal TLS erwarten
# -> Traefik spricht HTTP gegen einen HTTPS-Port und es gibt 502/Redirect-Loops.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cmd-params-cm
  namespace: infra
  labels:
    app.kubernetes.io/name: argocd-cmd-params-cm
    app.kubernetes.io/part-of: argocd
data:
  server.insecure: "true"
